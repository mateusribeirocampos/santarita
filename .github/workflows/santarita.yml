name: Keep Services Alive

on:
  schedule:
    # Four real database reads/day; Free plan pausing is not a resettable timer.
    - cron: '27 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  supabase-ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Supabase database monitoring row
        env:
          SUPABASE_MONITOR_TABLE: categories
          SUPABASE_URL: ${{ secrets.SUPABASE_SANTARITA_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SANTARITA_KEY }}
        run: bash .github/scripts/supabase-ping.sh
      - name: Render Backend Ping
        continue-on-error: true
        run: |
          # Ping the health endpoint to prevent Render free tier from sleeping.
          # A sleeping Render instance responds to CORS preflight without the
          # Access-Control-Allow-Origin header, causing frontend fetch failures.
          # continue-on-error: true — um timeout aqui (cold start > 60s) não pode
          # mais derrubar o job inteiro nem impedir o step acima de já ter rodado.
          response=$(curl -s -o /tmp/render_response.json -w "%{http_code}" \
                --max-time 60 \
                "${{ secrets.RENDER_BACKEND_URL }}/api/health")

          echo "Render backend ping response: $response"

          if [[ "$response" =~ ^2[0-9][0-9]$ ]]; then
            echo "Render backend is active"
            cat /tmp/render_response.json
          else
            echo "Render backend ping returned status $response (may be waking up)"
            cat /tmp/render_response.json
          fi
