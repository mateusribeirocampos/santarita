name: Keep Services Alive
permissions:
  contents: read
  actions: read

on:
  schedule:
    # Diário: o agendador do GitHub é best-effort e pode pular um disparo
    # inteiro (não só atrasar) — visto em 28/09/2026 com seg/qua/sex, que
    # deixou o Supabase pausar bem antes do limiar de 7 dias. Rodando todo
    # dia, um pulo isolado ainda deixa o próximo dia como rede de segurança.
    - cron: '27 9 * * *'
  workflow_dispatch:

jobs:
  supabase-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase Database Ping
        run: |
          # /rest/v1/<tabela>?select=id&limit=1 — o PostgREST traduz em SELECT no
          # Postgres, que é o que conta como atividade. NÃO usar /rest/v1/ puro: devolve
          # o schema OpenAPI a partir de cache em memória, podendo responder 200 sem
          # tocar o banco. Mesma armadilha do /auth/v1/health.
          # Roda antes do ping do Render: um timeout do Render não pode mais
          # impedir esse request de sair (é o que evita a pausa do Supabase).
          success=false
          for attempt in 1 2 3; do
            response=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 30 \
                  -H "apikey: ${{ secrets.SUPABASE_SANTARITA_KEY }}" \
                  -H "Authorization: Bearer ${{ secrets.SUPABASE_SANTARITA_KEY }}" \
                  "${{ secrets.SUPABASE_SANTARITA_URL }}/rest/v1/categories?select=id&limit=1")
            echo "Attempt $attempt: database ping response $response"
            if [[ "$response" =~ ^2[0-9][0-9]$ ]]; then
              success=true
              break
            fi
            sleep 15
          done
          cat /tmp/response.json

          if [ "$success" = "true" ]; then
            echo "Supabase database is active"
          else
            echo "Supabase database ping failed after 3 attempts"
            exit 1
          fi

      - name: Render Backend Ping
        continue-on-error: true
        run: |
          # Ping the health endpoint to prevent Render free tier from sleeping.
          # A sleeping Render instance responds to CORS preflight without the
          # Access-Control-Allow-Origin header, causing frontend fetch failures.
          # continue-on-error: true — um timeout aqui (cold start > 60s) não pode
          # mais derrubar o job inteiro nem impedir o step acima de já ter rodado.
          response=$(curl -s -o /tmp/render_response.json -w "%{http_code}" \
                --max-time 60 \
                "${{ secrets.RENDER_BACKEND_URL }}/api/health")

          echo "Render backend ping response: $response"

          if [[ "$response" =~ ^2[0-9][0-9]$ ]]; then
            echo "Render backend is active"
            cat /tmp/render_response.json
          else
            echo "Render backend ping returned status $response (may be waking up)"
            cat /tmp/render_response.json
          fi
